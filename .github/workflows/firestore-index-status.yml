name: Firestore Index Status

on:
  workflow_dispatch:

jobs:
  list-indexes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List deployed Firestore indexes
        uses: w9jds/firebase-action@v15.34.2
        with:
          args: firestore:indexes --project wargaja-91e14
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
