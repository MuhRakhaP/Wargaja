name: Build & Deploy to Firebase

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          preinstalled-runtimes: false
          swap-storage: false
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: 'stable'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Release keystore secret is not set, falling back to debug signing."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/wargaja-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          cat > android/key.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Release signing configured."

      - name: Build APK (Release)
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"
            if flutter build apk --release --build-number=${{ github.run_number }}; then
              exit 0
            fi
            echo "::warning::Build attempt $attempt failed (likely a transient dependency download error). Retrying in 30s..."
            sleep 30
          done
          echo "::error::Build failed after 3 attempts"
          exit 1

      - name: Verify signing certificate
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$CERTS"
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            echo "$CERTS" | grep -qi "$EXPECTED_CERT_SHA256" \
              || { echo "::error::APK is not signed with the expected release certificate"; exit 1; }
            echo "Signing certificate matches the expected release key."
          else
            echo "::warning::ANDROID_CERT_SHA256 is not set, skipping certificate check."
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wargaja-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      
      - name: Deploy Firestore Rules & Indexes to Firebase
        if: github.event_name != 'pull_request'
        uses: w9jds/firebase-action@v15.34.2
        with:
          args: deploy --only firestore:rules,firestore:indexes --project wargaja-91e14 --non-interactive
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Deploy to Firebase App Distribution
        if: github.event_name != 'pull_request'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          appId: ${{ secrets.FIREBASE_APP_ID }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Wargaja build from GitHub Actions"
          testers: ${{ secrets.FIREBASE_TESTERS_EMAIL }}
          
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ APK built successfully! Download from Firebase App Distribution or check artifacts.'
            })
