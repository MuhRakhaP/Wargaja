name: Build & Deploy to Firebase

on:
  push:
    branches:
      - main
      - dev/farrel
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Run asset generators
        run: |
          flutter pub run flutter_launcher_icons
          flutter pub run flutter_native_splash:create
      
      - name: Build APK (Debug)
        run: flutter build apk --debug
        
      - name: Build APK (Release)
        run: flutter build apk --release
      
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v3
        with:
          name: wargaja-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      
      - name: Deploy to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          serviceCredentialsJson: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          appId: ${{ secrets.FIREBASE_APP_ID }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Wargaja build from GitHub Actions"
          testers: ${{ secrets.FIREBASE_TESTERS_EMAIL }}
          
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ APK built successfully! Download from Firebase App Distribution or check artifacts.'
            })
