org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
flutter.compileSdkVersion=35

# Plugin modules are compiled with Kotlin JVM target 11 (see build.gradle.kts) while
# their Java sources stay on the 1.8 target AGP configures. Mixed targets are valid
# here, so keep Kotlin's consistency check from failing the build.
kotlin.jvm.target.validation.mode=warning

# Retry dependency downloads that fail with transient network errors (GitHub
# release assets occasionally return 504 during CI runs).
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
